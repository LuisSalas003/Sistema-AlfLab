name: Reusable Build Framework

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Nombre del microservicio"
      dockerfile_path:
        required: true
        type: string
        description: "Ruta relativa hacia el Dockerfile"
      context_path:
        required: true
        type: string
        description: "Contexto de ejecución para el comando Docker Build"

jobs:
  build-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log Variable Configuration
        run: |
          echo "Configuracion de variables detectada"
          echo "Servicio a procesar: ${{ inputs.service_name }}"
          echo "Ubicacion del Dockerfile: ${{ inputs.dockerfile_path }}"
          echo "Contexto de Docker: ${{ inputs.context_path }}"

      # Impresion de variables globales de entorno
      - name: Imprimir Variables del Repositorio
        run: |
          echo "Variables globales de GitHub:"
          echo "Host de Base de Datos: ${{ vars.DB_HOST }}"
          echo "Puerto de la API: ${{ vars.PORT_API }}"
          echo "Base de Datos Master: ${{ vars.DB_MASTER_DATABASE }}"

      - name: Verificar Inyeccion de Secretos
        run: |
          echo "Verificando disponibilidad de secretos en el entorno aislado..."
          if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
            echo "Secretos criticos cargados en memoria y listos para Docker."
          else
            echo "Alerta: Los secretos no se heredaron correctamente."
            exit 1
          fi

      # Manipulacion dinamica de appsettings.json
      - name: Reemplazar appsettings para proyectos .NET
        shell: pwsh
        run: |
          $rutaJson = "${{ inputs.context_path }}/appsettings.json"
          
          if (Test-Path $rutaJson) {
              echo "Archivo appsettings.json detectado. Inyectando secretos..."
              $json = Get-Content $rutaJson | ConvertFrom-Json
              $json.ConnectionStrings.DefaultConnection = "Server=db-alflab-dotnet;Database=alflab_principal;Uid=root;Pwd=${{ secrets.DB_PASSWORD }};"
              $json | ConvertTo-Json -Depth 10 | Set-Content $rutaJson
              echo "Variables de entorno inyectadas correctamente en el JSON."
          } else {
              echo "No es un proyecto .NET o no existe appsettings.json. Omitiendo este paso."
          }

      # Fase de validacion de construccion local
      - name: Probar Construccion del Contenedor
        shell: bash
        run: |
          echo "Comprobando que el contenedor compila correctamente..."
          
          # Convertir el nombre a minusculas para cumplir con las reglas de Docker
          SERVICE_LOWER=$(echo "${{ inputs.service_name }}" | tr '[:upper:]' '[:lower:]')
          
          # Construir la imagen usando la nueva variable en minusculas
          docker build -t test-$SERVICE_LOWER -f ${{ inputs.dockerfile_path }} ${{ inputs.context_path }}
          
          echo "El contenedor se construyo sin errores. El codigo es estable."

      # Fase de empaquetado y exportacion de artefactos
      - name: Exportar Imagen a Archivo TAR
        shell: bash
        run: |
          SERVICE_LOWER=$(echo "${{ inputs.service_name }}" | tr '[:upper:]' '[:lower:]')
          echo "Empaquetando la imagen $SERVICE_LOWER para su almacenamiento..."
          
          # El comando 'docker save' convierte el contenedor en un archivo fisico
          docker save test-$SERVICE_LOWER > docker-image.tar

      - name: Subir Artifact a GitHub
        uses: actions/upload-artifact@v4
        with:
          # Nombrar el archivo dinamicamente segun el API que se este construyendo
          name: Imagen-Docker-${{ inputs.service_name }}
          path: docker-image.tar
          retention-days: 5