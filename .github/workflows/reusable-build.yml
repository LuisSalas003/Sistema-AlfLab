name: Reusable Build Framework

# 👈 FASE 2: DECLARACIÓN DE VARIABLES DE ENTRADA (INPUTS)
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Nombre del microservicio"
      dockerfile_path:
        required: true
        type: string
        description: "Ruta relativa hacia el Dockerfile"
      context_path:
        required: true
        type: string
        description: "Contexto de ejecución para el comando Docker Build"

jobs:
  build-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Aquí usamos las variables con la sintaxis ${{ inputs.NUESTRA_VARIABLE }}
      - name: Log Variable Configuration
        run: |
          echo "==== CONFIGURACIÓN DE VARIABLES DETECTADA ===="
          echo "Servicio a procesar: ${{ inputs.service_name }}"
          echo "Ubicación del Dockerfile: ${{ inputs.dockerfile_path }}"
          echo "Contexto de Docker: ${{ inputs.context_path }}"