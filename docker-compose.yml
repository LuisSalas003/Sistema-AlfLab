version: '3.8'

services:
  # ==========================================
  # 1. ECOSISTEMA NESTJS (API DE COTIZACIONES)
  # ==========================================
  db-master:
    build:
      context: ./alflab-cotizaciones-api # 👇 Cambiado: ahora apunta hacia la carpeta de Nest
      dockerfile: Dockerfile.db
    container_name: alflab_db_master
    restart: always
    env_file:             # 👈 AÑADIDO: Inyecta variables globales
      - .env
    command: --server-id=1 --log-bin=mysql-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MASTER_ROOT_PASSWORD:-Root_Profe_2026}
      MYSQL_DATABASE: ${DB_MASTER_DATABASE:-alflab_cotizaciones}
    ports:
      - "3309:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql

  db-replica:
    image: mysql:8.0
    container_name: alflab_db_replica
    restart: always
    env_file:             # 👈 AÑADIDO: Inyecta variables globales
      - .env
    command: --server-id=2 --read-only=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Root_Profe_2026}
      MYSQL_DATABASE: ${DB_REPLICA_DATABASE:-alflab_cotizaciones_replica}
    ports:
      - "3307:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql

  api-cotizaciones:
    build:
      context: ./alflab-cotizaciones-api # 👇 Cambiado: ahora apunta hacia la carpeta de Nest
      dockerfile: Dockerfile
    container_name: alflab_api_node
    restart: always
    env_file:             # 👈 AÑADIDO: Inyecta variables globales
      - .env
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db-master
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_MASTER_ROOT_PASSWORD:-Root_Profe_2026}
      - DB_NAME=${DB_MASTER_DATABASE:-alflab_cotizaciones}
      - JWT_SECRET=${JWT_SECRET:-Firma_Local_De_Prueba_2026}
    depends_on:
      - db-master

  # ==========================================
  # 2. ECOSISTEMA .NET (SISTEMA PRINCIPAL)
  # ==========================================
  db-alflab-dotnet:
    image: mysql:8.0
    container_name: alflab_db_dotnet
    restart: always
    env_file:             # 👈 AÑADIDO: Inyecta variables globales
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: alflab_principal
    ports:
      - "3308:3306"
    volumes:
      - mysql_dotnet_data:/var/lib/mysql

  api-principal:
    build:
      context: ./AlfLab.Api # 👇 Cambiado: quitamos los ".." porque ya estamos en la raíz, solo bajamos a la carpeta de .NET
      dockerfile: Dockerfile
    container_name: alflab_api_dotnet
    restart: always
    env_file:             # 👈 AÑADIDO: Inyecta variables globales
      - .env
    ports:
      - "5000:80"
    environment:
      # 👇 Sin comillas
      - ASPNETCORE_ENVIRONMENT=Development
      # 👇 Sin comillas al inicio ni al final
      - ConnectionStrings__DefaultConnection=Server=db-alflab-dotnet;Database=alflab_principal;Uid=root;Pwd=${DB_PASSWORD:-SuperPasswordPro_2026};
      - JWT_SECRET=${JWT_SECRET:-EstaEsUnaLlaveDeRespaldoPorSiFallaElEnv123!}
    depends_on:
      - db-alflab-dotnet
      - db-replica

# ==========================================
# 3. VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  mysql_master_data:
  mysql_replica_data:
  mysql_dotnet_data: