services:
  # ==========================================
  # 1. ECOSISTEMA NESTJS (API DE COTIZACIONES)
  # ==========================================
  db-master:
    image: mysql:8.0
    container_name: alflab_db_master
    restart: always
    env_file: 
      - .env
    # 👇 ACTIVAMOS GTID (El GPS para datos)
    command: ["mysqld", "--server-id=1", "--log-bin=mysql-bin", "--gtid_mode=ON", "--enforce_gtid_consistency=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MASTER_ROOT_PASSWORD:-Root_Profe_2026}
    ports:
      - "3309:3306"
    volumes:
      - ./data/mysql_master:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - alflab-network

  db-replica:
    image: mysql:8.0
    container_name: alflab_db_replica
    restart: always
    env_file: 
      - .env
    # 👇 ACTIVAMOS GTID Y MODO LECTURA
    command: ["mysqld", "--server-id=2", "--gtid_mode=ON", "--enforce_gtid_consistency=ON", "--read-only=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Root_Profe_2026}
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql_replica:/var/lib/mysql
      # 👇 SCRIPT PARA CONEXIÓN AUTOMÁTICA
      - ./scripts/replica-init.sql:/docker-entrypoint-initdb.d/replica-init.sql
    networks:
      - alflab-network

  api-cotizaciones:
    build:
      context: ./alflab-cotizaciones-api
      dockerfile: Dockerfile
    container_name: alflab_api_node
    restart: always
    env_file: 
      - .env
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db-master
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_MASTER_ROOT_PASSWORD:-Root_Profe_2026}
      - DB_NAME=alflab_cotizaciones
      - JWT_SECRET=${JWT_SECRET:-Firma_Local_De_Prueba_2026}
      - TZ=America/Mexico_City
    depends_on:
      - db-master
    networks:
      - alflab-network

  # ==========================================
  # 2. ECOSISTEMA .NET (SISTEMA PRINCIPAL)
  # ==========================================
  db-alflab-dotnet:
    image: mysql:8.0
    container_name: alflab_db_dotnet
    restart: always
    env_file: 
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql_dotnet:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - alflab-network

  api-principal:
    build:
      context: ./AlfLab.Api 
    container_name: alflab_api_dotnet
    restart: always
    env_file: 
      - .env
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db-alflab-dotnet;Database=alflab_principal;Uid=root;Pwd=${DB_PASSWORD:-SuperPasswordPro_2026};
      - JWT_SECRET=${JWT_SECRET:-EstaEsUnaLlaveDeRespaldoPorSiFallaElEnv123!}
    depends_on:
      - db-alflab-dotnet
      - db-replica
    networks:
      - alflab-network
    volumes:
      - ./data/aspnet_keys:/app/keys

networks:
  alflab-network:
    driver: bridge