version: '3.8'

services:
  # ==========================================
  # 1. ECOSISTEMA NESTJS (API DE COTIZACIONES)
  # ==========================================
  db-master:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: alflab_db_master
    restart: always
    command: --server-id=1 --log-bin=mysql-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MASTER_ROOT_PASSWORD:-Root_Profe_2026} # <-- Actualizado
      MYSQL_DATABASE: ${DB_MASTER_DATABASE:-alflab_cotizaciones}           # <-- Actualizado
    ports:
      - "3309:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql

  db-replica:
    image: mysql:8.0
    container_name: alflab_db_replica
    restart: always
    command: --server-id=2 --read-only=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Root_Profe_2026}
      MYSQL_DATABASE: ${DB_REPLICA_DATABASE:-alflab_cotizaciones_replica}
    ports:
      - "3307:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql

  api-cotizaciones:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alflab_api_node
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db-master
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_MASTER_ROOT_PASSWORD:-Root_Profe_2026} # <-- Le pasamos la contraseña real
      - DB_NAME=${DB_MASTER_DATABASE:-alflab_cotizaciones}          # <-- Le pasamos la BD real
      - JWT_SECRET=${JWT_SECRET:-Firma_Local_De_Prueba_2026}
    depends_on:
      - db-master

  # ==========================================
  # 2. ECOSISTEMA .NET (SISTEMA PRINCIPAL)
  # ==========================================
  db-alflab-dotnet:
    image: mysql:8.0
    container_name: alflab_db_dotnet
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: alflab_principal
    ports:
      - "3308:3306"
    volumes:
      - mysql_dotnet_data:/var/lib/mysql

  api-principal:
    build:
      context: ../AlfLab.Api
      dockerfile: Dockerfile
    container_name: alflab_api_dotnet
    restart: always
    ports:
      - "5000:80"
    environment:
      # Obligamos a .NET a correr en modo desarrollo
      - ASPNETCORE_ENVIRONMENT="Development"
      # Protegemos la cadena con comillas para que Docker no la rompa
      - ConnectionStrings__DefaultConnection="Server=db-alflab-dotnet;Database=alflab_principal;Uid=root;Pwd=${DB_PASSWORD:-SuperPasswordPro_2026};"
      # Le pasamos la llave para que pueda fabricar los Tokens
      - JWT_SECRET=${JWT_SECRET:-EstaEsUnaLlaveDeRespaldoPorSiFallaElEnv123!}
    depends_on:
      - db-alflab-dotnet
      - db-replica

# ==========================================
# 3. VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  mysql_master_data:
  mysql_replica_data:
  mysql_dotnet_data: